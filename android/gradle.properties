org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Irrelevant on AGP 8, kept for when this project moves back to AGP 9.
#
# On AGP 9 this flag is a trap: plugins are split mid-migration. file_picker
# stops applying the Kotlin Gradle Plugin and needs this true; cloud_firestore
# still applies it and fails unless it is false. No value satisfies both, which
# is why the project is pinned to AGP 8 below.
android.builtInKotlin=false
